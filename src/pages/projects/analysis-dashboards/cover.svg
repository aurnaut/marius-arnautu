<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- An eye with the iris cut out, and a pie chart for an iris -->
  <path d="M60 300Q300 80 540 300Q300 520 60 300Z M386 300a86 86 0 1 0 -172 0a86 86 0 1 0 172 0Z" fill="#24A529" fill-rule="evenodd"/>
  <!-- Each slice is a circle half the pie's radius, with a stroke as wide as the pie, measured as 100 round,
       so its dash is its share and its offset is the shares before it. They start from the top. -->
  <g fill="none" stroke-width="72" transform="rotate(-90 300 300)">
    <circle cx="300" cy="300" r="36" pathLength="100" stroke="#F76A6A" stroke-dasharray="50 100" stroke-dashoffset="0"/>
    <circle cx="300" cy="300" r="36" pathLength="100" stroke="#EFB940" stroke-dasharray="30 100" stroke-dashoffset="-50"/>
    <circle cx="300" cy="300" r="36" pathLength="100" stroke="#3A16D3" stroke-dasharray="20 100" stroke-dashoffset="-80"/>
  </g>
</svg>
