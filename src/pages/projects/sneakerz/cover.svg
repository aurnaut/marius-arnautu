<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- A low sneaker in two shapes. The upper is a single slope from the heel down to the toe,
       with the laces cut out as short slanted lines along the slope. -->
