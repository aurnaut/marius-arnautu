    <mask id="laces" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="600">
      <rect width="600" height="600" fill="#fff"/>
      <path d="M250 280.6L218.8 356M290 290.3L262.8 356M330 300.1L306.9 356M370 309.9L350.9 356" stroke="#000" stroke-width="8"/>
    </mask>
  </defs>
  <g transform="translate(0 -58)">
    <path d="M80 410V245L530 355V410Z" fill="#EFB940" mask="url(#laces)"/>
    <rect x="62" y="420" width="476" height="50" fill="#3A16D3"/>
  </g>
</svg>
